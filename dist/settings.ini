; ShotPin 设置文件
; 修改后可在托盘菜单点“重新加载设置”，无需重启。

[general]
; 截图后自动复制到剪贴板
auto_copy=1
; 截图后自动保存 PNG 到 save_dir
auto_save=0
save_dir=%USERPROFILE%\Pictures\ShotPin
; 桌面装饰挂线：高度百分比（5-60）、颜色、粗细（1-6）
; 也可以运行时拖动挂线最左端的小绳结调整高度
line_y_percent=12
line_color=#C9B99A
line_width=2

[hotkeys]
; 格式：Ctrl+Shift+A、Ctrl+Shift+F12、Alt+PrintScreen
; 如快捷键被其它程序占用，可改成其它组合后重新加载设置。
region=Ctrl+Shift+A
fullscreen=Ctrl+Alt+F
toggle_board=Ctrl+Alt+H
close_all=Ctrl+Alt+Shift+Q
